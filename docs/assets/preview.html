<!DOCTYPE html>
<html><head><style>

.row { display:flex; align-items:flex-end; gap:24px; }
img { display:block; }

</style></head><body>

  <div class="dark"><img src="logo-dark.svg" width="200" height="200"><div class="label">dark 200</div></div>
  <div><img src="logo-icon.svg" width="200" height="200"><div class="label">icon 200</div></div>
</div>
<div class="row">
  <div><img src="logo-icon.svg" width="64" height="64"><div class="label">64</div></div>
  <div><img src="icon-32.svg" width="32" height="32"><div class="label">32 cut</div></div>
  <div><img src="icon-16.svg" width="16" height="16"><div class="label">16 cut</div></div>
</div>
</body></html>
