<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nautilus logo preview</title>
  <link rel="icon" href="favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 1rem system-ui, sans-serif; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); }
    section { display: grid; justify-items: center; align-content: start; gap: 1.5rem; padding: 2rem 1rem; color: #1f2328; background: #fff; }
    .dark { color: #f0f6fc; background: #0d1117; }
    h2 { margin: 0; font-size: 1rem; }
    img { display: block; max-width: 100%; height: auto; }
    .icons { display: flex; align-items: end; gap: 1.5rem; }
    figure { display: grid; justify-items: center; gap: .5rem; margin: 0; }
    figcaption { font-size: .75rem; }
  </style>
</head>
<body>
  <main aria-label="Nautilus logo preview">
    <section aria-labelledby="light">
      <h2 id="light">Light background</h2>
      <img src="nautilus-logo-horizontal.svg" width="318" alt="Nautilus horizontal logo">
      <img src="nautilus-mascot.svg" width="120" alt="Nautilus mascot">
      <img src="nautilus-wordmark.svg" width="210" alt="Nautilus wordmark">
      <div class="icons">
        <figure><img src="favicon.ico" width="16" alt="Favicon"><figcaption>16 px</figcaption></figure>
        <figure><img src="favicon.ico" width="32" alt="Favicon"><figcaption>32 px</figcaption></figure>
        <figure><img src="favicon.ico" width="64" alt="Favicon"><figcaption>64 px</figcaption></figure>
      </div>
    </section>
    <section class="dark" aria-labelledby="dark">
      <h2 id="dark">Dark background</h2>
      <img src="nautilus-logo-horizontal.svg" width="318" alt="Nautilus horizontal logo">
      <img src="nautilus-mascot.svg" width="120" alt="Nautilus mascot">
      <img src="nautilus-wordmark.svg" width="210" alt="Nautilus wordmark">
      <div class="icons">
        <figure><img src="favicon.ico" width="16" alt="Favicon"><figcaption>16 px</figcaption></figure>
        <figure><img src="favicon.ico" width="32" alt="Favicon"><figcaption>32 px</figcaption></figure>
        <figure><img src="favicon.ico" width="64" alt="Favicon"><figcaption>64 px</figcaption></figure>
      </div>
    </section>
  </main>
</body>
</html>
